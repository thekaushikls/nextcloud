services:

  postgres:
    image: postgres:16
    container_name: nextcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - redis:/data

  app:
    image: nextcloud:32.0.3
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${PORT}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 2G
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      NEXTCLOUD_APPS: ${NEXTCLOUD_APPS}
      PERSISTENT_DATA_PATH: ${PERSISTENT_DATA_PATH}
    volumes:
      - ${PERSISTENT_DATA_PATH}/data:/var/www/html/data
      - ${PERSISTENT_DATA_PATH}/config:/var/www/html/config
      - ${PERSISTENT_DATA_PATH}/custom_apps:/var/www/html/custom_apps
      - ${PERSISTENT_DATA_PATH}/themes:/var/www/html/themes

      - ./hooks:/docker-entrypoint-hooks.d

volumes:
  postgres:
  redis:
